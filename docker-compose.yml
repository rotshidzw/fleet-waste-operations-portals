services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: njilo
      POSTGRES_PASSWORD: njilo
      POSTGRES_DB: njilo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  public-web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.public
    environment:
      DATABASE_URL: postgresql://njilo:njilo@db:5432/njilo
    ports:
      - "3000:3000"
    depends_on:
      - db

  intranet:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.intranet
    environment:
      DATABASE_URL: postgresql://njilo:njilo@db:5432/njilo
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: supersecret
    ports:
      - "3001:3001"
    depends_on:
      - db

volumes:
  db-data:
