services:
  postgres:
    image: postgres:16
    container_name: njilo-postgres
    environment:
      POSTGRES_USER: njilo
      POSTGRES_PASSWORD: njilo_password
      POSTGRES_DB: njilo_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: njilo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
volumes:
  postgres_data:
